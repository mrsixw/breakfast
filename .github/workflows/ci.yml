name: CI

on:
  pull_request:
  push:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Run tests
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Run lint
        run: make lint

  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # bats arrives through npx, so node is the only prerequisite. The suite
      # itself is offline: every script it drives has gh, git and curl stubbed.
      - name: Run the shell test suite
        run: make bats

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, bats]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Build binary
        run: make build

      - name: Verify binary version
        run: utils/check_binary_version.sh

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: breakfast-zipapp
          path: breakfast
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [build]
    # Issue #99: post-build, before release. Runs against the artifact the
    # build job produced rather than rebuilding, so the bits under test are
    # the bits that ship.
    #
    # No fork guard: the live scenarios only read the public fixture repo, and
    # the built-in GITHUB_TOKEN is provided (read-only) to pull requests from
    # forks. Verified sufficient in CI, so forks get the full suite. If this
    # ever needs secrets.GH_TOKEN, a guard skipping fork PRs must come back —
    # secrets.* are not exposed to them.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: breakfast-zipapp

      # Artifacts travel as zips and do not preserve the executable bit.
      - name: Restore executable bit
        run: chmod +x breakfast

      - name: Run end-to-end suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make e2e-ci

  spell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      # `make spell` rather than the crate-ci/typos action, so the version
      # pinned in the Makefile is the one that runs both here and locally.
      - name: Check spelling
        run: make spell

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint markdown docs
        run: make docs-lint

  man:
    runs-on: ubuntu-latest
    needs: [test, lint, spell, docs-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Generate man page
        run: make man

      - name: Verify man page
        run: |
          test -f man1/breakfast.1.gz
          man -l man1/breakfast.1.gz | head -1 | grep -q "breakfast"

  completions:
    runs-on: ubuntu-latest
    needs: [test, lint, bats]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Generate completion scripts
        run: make completions

      - name: Install zsh and fish
        run: sudo apt-get install -y zsh fish

      - name: Verify completion scripts
        run: |
          test -f completions/breakfast.bash
          test -f completions/_breakfast
          test -f completions/breakfast.fish
          source completions/breakfast.bash && complete -p breakfast
          zsh -i -c "autoload -Uz compinit && compinit -u && source completions/_breakfast && echo 'zsh ok'"
          fish -c "source completions/breakfast.fish && echo 'fish ok'"

      - name: Verify completions subcommand works for all shells
        run: |
          uv run python -m breakfast.cli completions bash | grep -q "_BREAKFAST_COMPLETE"
          uv run python -m breakfast.cli completions zsh | grep -q "_BREAKFAST_COMPLETE"
          uv run python -m breakfast.cli completions fish | grep -q "_BREAKFAST_COMPLETE"

      - name: Verify the deprecated --completion flag keeps stdout evaluable
        run: |
          # The deprecation notice must stay on stderr: stdout is eval'd by the
          # user's shell, so a stray notice there is a startup syntax error.
          uv run python -m breakfast.cli --completion bash 2>/dev/null | grep -q "_BREAKFAST_COMPLETE"
          ! uv run python -m breakfast.cli --completion bash 2>/dev/null | grep -q "deprecated"
          uv run python -m breakfast.cli --completion bash 2>&1 >/dev/null | grep -q "deprecated"

  release:
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    needs: [build, e2e, man, completions]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Install git-mkver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: utils/install_git_mkver.sh

      - name: Fetch tags
        run: git fetch --tags

      - name: Read version
        id: version
        run: echo "version=$(python utils/read_version.py)" >> "$GITHUB_OUTPUT"

      - name: Bump version if tag exists
        id: bump
        run: |
          version="$(utils/bump_version_if_tag_exists.sh "${{ steps.version.outputs.version }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: make release

      - name: Generate man page
        run: make man

      - name: Generate completion scripts
        run: make completions

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: utils/create_release.sh "${{ steps.bump.outputs.version }}"

  verify-release:
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install latest release
        run: |
          curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh | bash

      - name: Verify installation
        run: |
          ~/.local/bin/breakfast --version
          ls -l ~/.config/breakfast/config.toml

      - name: Verify man page
        run: |
          export MANPATH="${HOME}/.local/share/man:${MANPATH}"
          man breakfast | head -1 | grep -q "breakfast"

      - name: Install zsh and fish
        run: sudo apt-get install -y zsh fish

      - name: Verify bash completions
        run: |
          source ~/.local/share/bash-completion/completions/breakfast
          complete -p breakfast

      - name: Verify zsh completions
        run: zsh -i -c "autoload -Uz compinit && compinit -u && source ~/.local/share/zsh/site-functions/_breakfast && echo 'zsh ok'"

      - name: Verify fish completions
        run: fish -c "source ~/.config/fish/completions/breakfast.fish && echo 'fish ok'"
