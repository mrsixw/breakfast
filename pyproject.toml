[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breakfast"
dynamic = ["version"]
description = "A tool to help you start your day"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steve Williams" }]
dependencies = [
  "click",
  "requests",
  "tabulate",
  "wcwidth",
]

[project.scripts]
breakfast = "breakfast.cli:breakfast"

[project.optional-dependencies]
test = [
  # Pinned below 10: pytest-bdd 8.1.0 (the latest release) calls
  # FixtureManager._register_fixture and FixtureDef(baseid=...), both of which
  # pytest 9 flags as PytestRemovedIn10Warning. On pytest 10 the e2e suite
  # would stop collecting, and since `release` is gated on the e2e job that
  # blocks releases rather than merely failing a test. Remove this pin once
  # pytest-bdd ships a release that no longer uses them — see issue #454.
  "pytest<10",
  "pytest-bdd>=8.1,<9",
  "requests-mock",
  "freezegun",
]
lint = [
  "black",
  "ruff",
]
build = [
  "shiv",
  "click-man",
]
dev = [
  "black",
  "click-man",
  "freezegun",
  "pytest<10",  # see the note in the `test` extra, and issue #454
  "pytest-bdd>=8.1,<9",
  "requests-mock",
  "ruff",
  "shiv",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# End-to-end scenarios drive the built zipapp and need `make build` (and, for
# the live ones, a token). Excluded by default so a bare `pytest` stays fast
# and offline; `make e2e` passes `-m e2e` on the command line, which wins.
addopts = "-m 'not e2e'"
markers = [
  "e2e: drives the built ./breakfast zipapp as a subprocess (needs `make build`)",
  "live: hits the real GitHub API against the frozen fixture repo (needs a token)",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
